<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notifikasi - Ruang Aksara STTCipasung</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #1f2937;
      transition: 0.3s;
    }

    body.dark {
      background: #111827;
      color: #f3f4f6;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 250px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      padding: 22px 15px;
      z-index: 1000;
      transition: 0.3s;
    }

    body.dark .sidebar {
      background: #1f2937;
      border-color: #374151;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h2 {
      color: #2563eb;
      font-size: 22px;
    }

    .logo p {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }

    body.dark .logo p {
      color: #9ca3af;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 14px;
      border-radius: 10px;
      text-decoration: none;
      color: #4b5563;
      transition: 0.2s;
      font-size: 14px;
    }

    body.dark .menu-item {
      color: #d1d5db;
    }

    .menu-item:hover {
      background: #eff6ff;
      color: #2563eb;
      transform: translateX(3px);
    }

    body.dark .menu-item:hover {
      background: #374151;
      color: #60a5fa;
    }

    .menu-item.active {
      background: #2563eb;
      color: white;
    }

    .menu-icon {
      width: 22px;
      text-align: center;
      font-size: 17px;
    }

    /* ================= MAIN ================= */

    .main {
      margin-left: 250px;
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: sticky;
      top: 0;
      z-index: 900;
    }

    body.dark .topbar {
      background: #1f2937;
      border-color: #374151;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: bold;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dark-button,
    .menu-button {
      border: none;
      background: #f3f4f6;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    body.dark .dark-button,
    body.dark .menu-button {
      background: #374151;
      color: white;
    }

    .menu-button {
      display: none;
    }

    /* ================= CONTENT ================= */

    .content {
      padding: 30px;
      max-width: 1000px;
    }

    .page-header {
      margin-bottom: 25px;
    }

    .page-header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .page-header p {
      color: #6b7280;
      font-size: 14px;
    }

    body.dark .page-header p {
      color: #9ca3af;
    }

    /* ================= SUMMARY ================= */

    .notification-summary {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .summary-left h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .summary-left p {
      opacity: 0.9;
      font-size: 14px;
    }

    .summary-number {
      min-width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    /* ================= ACTION ================= */

    .notification-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 18px;
    }

    .action-button {
      border: none;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #374151;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
    }

    .action-button:hover {
      background: #f3f4f6;
    }

    .action-button.danger {
      color: #dc2626;
    }

    body.dark .action-button {
      background: #1f2937;
      border-color: #374151;
      color: #e5e7eb;
    }

    body.dark .action-button:hover {
      background: #374151;
    }

    /* ================= NOTIFICATION CARD ================= */

    .notification-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notification-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      align-items: flex-start;
      gap: 15px;
      transition: 0.2s;
    }

    body.dark .notification-card {
      background: #1f2937;
      border-color: #374151;
    }

    .notification-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }

    .notification-card.unread {
      border-left: 4px solid #2563eb;
      background: #eff6ff;
    }

    body.dark .notification-card.unread {
      background: #172554;
    }

    .notification-icon {
      width: 45px;
      height: 45px;
      min-width: 45px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #dbeafe;
    }

    .notification-icon.success {
      background: #dcfce7;
    }

    .notification-icon.info {
      background: #dbeafe;
    }

    .notification-icon.warning {
      background: #fef3c7;
    }

    .notification-icon.error {
      background: #fee2e2;
    }

    .notification-content {
      flex: 1;
    }

    .notification-content h3 {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .notification-content p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    body.dark .notification-content p {
      color: #9ca3af;
    }

    .notification-date {
      margin-top: 8px;
      font-size: 12px;
      color: #9ca3af;
    }

    .notification-status {
      font-size: 11px;
      color: #2563eb;
      font-weight: bold;
      margin-top: 6px;
    }

    .notification-tools {
      display: flex;
      gap: 6px;
      flex-direction: column;
    }

    .small-button {
      border: none;
      background: #f3f4f6;
      padding: 7px 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .small-button:hover {
      background: #e5e7eb;
    }

    body.dark .small-button {
      background: #374151;
      color: white;
    }

    /* ================= EMPTY ================= */

    .empty-state {
      background: #ffffff;
      border: 1px dashed #d1d5db;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
    }

    body.dark .empty-state {
      background: #1f2937;
      border-color: #4b5563;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .empty-state h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 20px;
    }

    body.dark .empty-state p {
      color: #9ca3af;
    }

    .home-button {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 768px) {

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.show {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
      }

      .menu-button {
        display: block;
      }

      .topbar {
        padding: 0 15px;
      }

      .topbar-title {
        font-size: 17px;
      }

      .content {
        padding: 20px 15px;
      }

      .notification-summary {
        padding: 20px;
      }

      .summary-left h2 {
        font-size: 18px;
      }

      .summary-number {
        min-width: 55px;
        height: 55px;
        font-size: 21px;
      }

      .notification-card {
        padding: 14px;
      }

      .notification-tools {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>

  <!-- ================= SIDEBAR ================= -->

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <h2>Ruang Aksara</h2>
      <p>RUANG LITERASI STTCIPASUNG</p>
    </div>

    <nav class="menu">

      <a href="index.html" class="menu-item">
        <span class="menu-icon">🏠</span>
        <span>Beranda</span>
      </a>

      <a href="index.html#karya" class="menu-item">
        <span class="menu-icon">📚</span>
        <span>Karya</span>
      </a>

      <a href="kirim-karya.html" class="menu-item">
        <span class="menu-icon">✎</span>
        <span>Kirim Karya</span>
      </a>

      <a href="favorit.html" class="menu-item">
        <span class="menu-icon">♡</span>
        <span>Favorit</span>
      </a>

      <a href="notifikasi.html" class="menu-item active">
        <span class="menu-icon">🔔</span>
        <span>Notifikasi</span>
      </a>

      <a href="profil.html" class="menu-item">
        <span class="menu-icon">👤</span>
        <span>Profil</span>
      </a>

      <a href="index.html#tentang" class="menu-item">
        <span class="menu-icon">ℹ</span>
        <span>Tentang</span>
      </a>

      <a href="index.html#kontak" class="menu-item">
        <span class="menu-icon">✉</span>
        <span>Kontak</span>
      </a>

    </nav>

  </aside>


  <!-- ================= MAIN ================= -->

  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:10px;">

        <button class="menu-button" id="menuButton">
          ☰
        </button>

        <div class="topbar-title">
          Notifikasi
        </div>

      </div>

      <div class="topbar-actions">

        <button class="dark-button" id="darkButton">
          🌙 Mode Gelap
        </button>

      </div>

    </header>


    <!-- ================= CONTENT ================= -->

    <section class="content">

      <div class="page-header">

        <h1>🔔 Notifikasi</h1>

        <p>
          Pantau informasi terbaru mengenai aktivitas dan karya kamu di Ruang Aksara.
        </p>

      </div>


      <!-- SUMMARY -->

      <div class="notification-summary">

        <div class="summary-left">

          <h2>Notifikasi Kamu</h2>

          <p id="summaryText">
            Tidak ada notifikasi baru.
          </p>

        </div>

        <div class="summary-number" id="unreadCount">
          0
        </div>

      </div>


      <!-- ACTION -->

      <div class="notification-actions">

        <button
          class="action-button"
          id="markAllButton"
        >
          ✓ Tandai Semua Dibaca
        </button>

        <button
          class="action-button danger"
          id="clearButton"
        >
          🗑 Hapus Semua
        </button>

      </div>


      <!-- LIST -->

      <div
        class="notification-list"
        id="notificationList"
      ></div>

    </section>

  </main>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    const notificationKey = "ruangAksaraNotifications";

    const notificationList =
      document.getElementById("notificationList");

    const unreadCount =
      document.getElementById("unreadCount");

    const summaryText =
      document.getElementById("summaryText");

    const markAllButton =
      document.getElementById("markAllButton");

    const clearButton =
      document.getElementById("clearButton");


    /* ================= GET DATA ================= */

    function getNotifications() {

      try {

        const data =
          JSON.parse(
            localStorage.getItem(notificationKey)
          );

        return Array.isArray(data) ? data : [];

      } catch (error) {

        return [];

      }

    }


    /* ================= SAVE DATA ================= */

    function saveNotifications(notifications) {

      localStorage.setItem(
        notificationKey,
        JSON.stringify(notifications)
      );

    }


    /* ================= DATE ================= */

    function formatDate(dateString) {

      if (!dateString) {
        return "Tanggal tidak diketahui";
      }

      const date = new Date(dateString);

      if (isNaN(date.getTime())) {
        return "Tanggal tidak diketahui";
      }

      return date.toLocaleDateString(
        "id-ID",
        {
          day: "numeric",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* ================= ICON ================= */

    function getIcon(type) {

      if (type === "success") {
        return "✓";
      }

      if (type === "warning") {
        return "⚠";
      }

      if (type === "error") {
        return "✕";
      }

      return "🔔";

    }


    /* ================= RENDER ================= */

    function renderNotifications() {

      const notifications =
        getNotifications();

      const unread =
        notifications.filter(
          notification => !notification.read
        ).length;


      /* UPDATE COUNT */

      unreadCount.textContent = unread;


      if (unread === 0) {

        summaryText.textContent =
          notifications.length > 0
            ? "Semua notifikasi sudah dibaca."
            : "Tidak ada notifikasi baru.";

      } else {

        summaryText.textContent =
          `Kamu memiliki ${unread} notifikasi yang belum dibaca.`;

      }


      /* EMPTY */

      if (notifications.length === 0) {

        notificationList.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              🔔
            </div>

            <h2>
              Belum Ada Notifikasi
            </h2>

            <p>
              Notifikasi aktivitas kamu akan muncul di halaman ini.
            </p>

            <a
              href="kirim-karya.html"
              class="home-button"
            >
              ✎ Kirim Karya
            </a>

          </div>

        `;

        return;

      }


      /* SORT */

      notifications.sort(
        (a, b) =>
          new Date(b.date || 0) -
          new Date(a.date || 0)
      );


      /* RENDER */

      notificationList.innerHTML =
        notifications.map(
          notification => {

            const isUnread =
              !notification.read;

            return `

              <article
                class="notification-card ${isUnread ? "unread" : ""}"
              >

                <div
                  class="notification-icon ${notification.type || "info"}"
                >
                  ${getIcon(notification.type)}
                </div>


                <div class="notification-content">

                  <h3>
                    ${escapeHTML(
                      notification.title ||
                      "Notifikasi"
                    )}
                  </h3>

                  <p>
                    ${escapeHTML(
                      notification.message ||
                      "Tidak ada informasi."
                    )}
                  </p>

                  <div class="notification-date">
                    🕒 ${formatDate(notification.date)}
                  </div>

                  ${
                    isUnread
                      ? `
                        <div class="notification-status">
                          ● Belum dibaca
                        </div>
                      `
                      : `
                        <div
                          class="notification-status"
                          style="color:#9ca3af;"
                        >
                          ✓ Sudah dibaca
                        </div>
                      `
                  }

                </div>


                <div class="notification-tools">

                  ${
                    isUnread
                      ? `
                        <button
                          class="small-button"
                          onclick="markAsRead('${notification.id}')"
                        >
                          ✓ Baca
                        </button>
                      `
                      : ""
                  }

                  <button
                    class="small-button"
                    onclick="deleteNotification('${notification.id}')"
                  >
                    🗑
                  </button>

                </div>

              </article>

            `;

          }
        ).join("");

    }


    /* ================= ESCAPE HTML ================= */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ================= MARK READ ================= */

    function markAsRead(id) {

      const notifications =
        getNotifications();

      const updated =
        notifications.map(
          notification => {

            if (
              String(notification.id) ===
              String(id)
            ) {

              return {
                ...notification,
                read: true
              };

            }

            return notification;

          }
        );

      saveNotifications(updated);

      renderNotifications();

    }


    /* ================= MARK ALL ================= */

    markAllButton.addEventListener(
      "click",
      function() {

        const notifications =
          getNotifications();

        if (notifications.length === 0) {
          return;
        }

        const updated =
          notifications.map(
            notification => ({
              ...notification,
              read: true
            })
          );

        saveNotifications(updated);

        renderNotifications();

      }
    );


    /* ================= DELETE ================= */

    function deleteNotification(id) {

      const notifications =
        getNotifications();

      const updated =
        notifications.filter(
          notification =>
            String(notification.id) !==
            String(id)
        );

      saveNotifications(updated);

      renderNotifications();

    }


    /* ================= CLEAR ALL ================= */

    clearButton.addEventListener(
      "click",
      function() {

        const notifications =
          getNotifications();

        if (notifications.length === 0) {
          return;
        }

        const confirmed =
          confirm(
            "Yakin ingin menghapus semua notifikasi?"
          );

        if (!confirmed) {
          return;
        }

        localStorage.removeItem(
          notificationKey
        );

        renderNotifications();

      }
    );


    /* ================= DARK MODE ================= */

    const darkButton =
      document.getElementById("darkButton");


    function applyDarkMode() {

      const isDark =
        localStorage.getItem(
          "ruangAksaraDarkMode"
        ) === "true";

      document.body.classList.toggle(
        "dark",
        isDark
      );

      darkButton.textContent =
        isDark
          ? "☀️ Mode Terang"
          : "🌙 Mode Gelap";

    }


    darkButton.addEventListener(
      "click",
      function() {

        const isDark =
          document.body.classList.toggle(
            "dark"
          );

        localStorage.setItem(
          "ruangAksaraDarkMode",
          isDark
        );

        applyDarkMode();

      }
    );


    /* ================= MOBILE MENU ================= */

    const menuButton =
      document.getElementById("menuButton");

    const sidebar =
      document.getElementById("sidebar");


    menuButton.addEventListener(
      "click",
      function() {

        sidebar.classList.toggle("show");

      }
    );


    /* ================= START ================= */

    applyDarkMode();

    renderNotifications();

  </script>

</body>
</html>
